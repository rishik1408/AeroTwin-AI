version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: aerotwin_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=aerotwin
      - DOCKER_INFLUXDB_INIT_BUCKET=engine_telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      # To use an external hard drive, change this to your external drive path.
      # For example, on Windows with an external drive D:
      # - D:/aerotwin_influxdb_data:/var/lib/influxdb2
      - ./influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  fastapi_backend:
    build: ./backend
    container_name: aerotwin_api
    ports:
      - "8000:8000"
    depends_on:
      - influxdb
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-auth-token
      - INFLUXDB_ORG=aerotwin
      - INFLUXDB_BUCKET=engine_telemetry
    restart: unless-stopped
